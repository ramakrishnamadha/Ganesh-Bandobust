name: ar_flutter_plugin_2
description: This plugin is a fork of the original AR Flutter Plugin, created because the original plugin had not been updated since 2022.
version: 0.0.3
repository: https://github.com/hlefe/ar_flutter_plugin_2

environment:
  sdk: ">=2.16.1 <3.0.0"
  flutter: ">=1.20.0"

dependencies:
  flutter:
    sdk: flutter

  permission_handler: ^12.0.1
  vector_math: ^2.1.1
  json_annotation: ^4.9.0
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.uhg0.ar_flutter_plugin_2
        pluginClass: ArFlutterPlugin
      ios:
        pluginClass: ArFlutterPlugin